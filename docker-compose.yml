name: orchestra

services:
  # Nginx - Reverse Proxy
  nginx:
    image: nginx:1.30-alpine
    container_name: orchestra-nginx
    ports:
      - "8001:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    networks:
      - orchestra-network

  # PHP-FPM - Laravel Backend
  php:
    build:
      # Contexto e a raiz do backend (nao ./docker/php) porque o alvo `prod`
      # do mesmo Dockerfile copia o codigo da aplicacao. Ver .dockerignore.
      context: .
      dockerfile: docker/php/Dockerfile
      target: dev
    container_name: orchestra-php
    # O Laravel le APP_ENV do ambiente do processo (antes de carregar o .env) para
    # decidir se usa .env.<APP_ENV>. Com 'production' aqui, ele carrega .env.production;
    # com o default 'local', cai no .env de sempre.
    environment:
      APP_ENV: ${APP_ENV:-local}
    volumes:
      - .:/var/www/html
    networks:
      - orchestra-network
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  # MySQL Database
  mysql:
    image: mysql:8.4
    container_name: orchestra-mysql
    ports:
      - "3308:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: orchestra
      MYSQL_USER: orchestra
      MYSQL_PASSWORD: orchestra
    volumes:
      - orchestra-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - orchestra-network

  # Redis - Cache & Sessions
  redis:
    image: redis:8-alpine
    container_name: orchestra-redis
    ports:
      - "6380:6379"
    volumes:
      - orchestra-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - orchestra-network

  # Vue.js Frontend
  frontend:
    image: node:24-alpine
    container_name: orchestra-frontend
    working_dir: /app
    ports:
      - "3001:3000"
    volumes:
      - ../frontend:/app
      - /app/node_modules
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    networks:
      - orchestra-network
    depends_on:
      - nginx

  # Mailpit - Email Testing (sucessor do Mailhog)
  mailpit:
    image: axllent/mailpit:v1.31
    container_name: orchestra-mailpit
    ports:
      - "1026:1025"
      - "8026:8025"
    networks:
      - orchestra-network

networks:
  orchestra-network:
    driver: bridge

volumes:
  orchestra-mysql-data:
  orchestra-redis-data:
