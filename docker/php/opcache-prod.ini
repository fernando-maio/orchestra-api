; OPcache em producao.
;
; A diferenca central para desenvolvimento e validate_timestamps=0: o PHP para
; de checar o mtime de cada arquivo a cada requisicao. Em troca, a imagem passa
; a ser imutavel - um deploy exige recriar o container, nao basta trocar o
; arquivo em disco.
opcache.enable=1
opcache.enable_cli=0
opcache.validate_timestamps=0
opcache.memory_consumption=256
opcache.interned_strings_buffer=32
opcache.max_accelerated_files=20000
opcache.jit=tracing
opcache.jit_buffer_size=64M
